name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    ### 環境変数の設定
    ### GitHub SecretsにGCPのサービスアカウントキーとプロジェクトIDを設定しておく必要があります。
    ### GCP_SA_KEY: サービスアカウントキーのJSON
    ### GCP_PROJECT_ID: GCPのプロジェクトID
    env:
      IMAGE_NAME: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/github-actions-backend-repo/github_actions_tutorial-backend
      CLOUD_RUN_SERVICE: github-actions-backend
      CLOUD_RUN_REGION: asia-northeast1
    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 依存関係をインストール
      - name: Install dependencies
        run: npm ci --prefix backend

      # ユニットテストを実行
      - name: Run unit tests
        run: npm test --prefix backend

      # バックエンドをビルド
      - name: Build backend
        run: npm run build --prefix backend

      # Google Cloud に認証
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # gcloud CLI をセットアップ
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: docker-credential-gcr

      # Artifact Registry 用の Docker 認証
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker --quiet asia-northeast1-docker.pkg.dev

      # Docker イメージをビルド
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t "$IMAGE_NAME:${{ github.sha }}" .

      # Docker イメージを Artifact Registry にプッシュ
      - name: Push Docker image
        run: docker push "$IMAGE_NAME:${{ github.sha }}"

      # Cloud Run にデプロイ
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            --region "$CLOUD_RUN_REGION" \
            --platform managed \
            --allow-unauthenticated
