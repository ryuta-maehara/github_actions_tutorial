name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/github_actions_tutorial-backend
      CLOUD_RUN_SERVICE: github-actions-backend
      CLOUD_RUN_REGION: asia-northeast1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --prefix backend

      - name: Run unit tests
        run: npm test --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: ['docker-credential-gcr']

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Push Docker image
        run: docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            --region "$CLOUD_RUN_REGION" \
            --platform managed \
            --allow-unauthenticated
